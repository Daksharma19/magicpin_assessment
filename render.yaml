services:
  - type: web
    name: vera-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # free sleeps after 15 min idle; "starter" stays always-on
    healthCheckPath: /v1/healthz
    numInstances: 1       # state is in memory: never scale out
    envVars:
      - key: GROQ_API_KEY
        sync: false       # set in dashboard (secret)
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
